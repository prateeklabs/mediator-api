services:
  mediator-api:
    build: .
    container_name: mediator-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      # Persist runtime config overrides (dashboard changes) across container recreation
      - mediator-config:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mediator-config:
